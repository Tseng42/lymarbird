<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>活起來的圖卡 · 翠鳥 WebAR</title>

  <!-- ============================================================
       MindAR 官方 CDN（image-tracking, A-Frame 版）
       版本：MindAR 1.2.5 / A-Frame 1.5.0
       版本號同步記錄於 README.md，日後升級時兩處一起改。
       ============================================================ -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <!-- 學名（拉丁文）用襯線斜體：載入 Noto Serif TC；中文維持無襯線（系統字） -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600&display=swap" />

  <link rel="stylesheet" href="css/style.css?v=26" />
  <!-- 物種內容設定（文字＋素材路徑集中管理，非工程人員只需改這個檔） -->
  <script src="js/content.js?v=28"></script>
</head>
<body>

  <!-- ============================================================
       開始畫面：iOS 需要「使用者手勢」才能啟動相機與音效，
       所以先擋一層全螢幕按鈕，點擊後才啟動 MindAR。
       ============================================================ -->
  <div id="start-screen">
    <div id="start-inner">
      <p id="start-eyebrow">蘭陽博物館　·　飛行生物特展</p>
      <span id="start-rule"></span>
      <h1 id="start-title">活起來的圖卡</h1>
      <button id="start-button">開始體驗</button>
      <p id="start-hint">需允許相機權限　·　建議直式握持手機</p>
    </div>
  </div>

  <!-- 掃描提示（啟動後、尚未掃到圖卡時顯示） -->
  <div id="scan-hint" class="hidden">將鏡頭對準圖卡…</div>

  <!-- ============================================================
       2D「活起來」動態鳥圖（HTML 疊層，純視覺）——「上舞台」主角。
       ------------------------------------------------------------
       設計選擇：本專案所有視覺一律走 HTML 疊層（AR 場景刻意不放 3D 物件，
       見 <a-entity id="target"> 註解），為求穩定與架構一致，這裡採規格書
       允許的「HTML 疊層」路線，而非在 target 上錨定 A-Frame plane。

       版面：#bird-layer 是鋪滿「上方舞台區」(高 --stage-h ≈ 40%) 的容器，
       鳥圖(sprite)以 flex 置中於舞台中央；底部抽屜面板(60%)不覆蓋此區，
       故面板開啟時鳥仍完整可見。
       時序（驚艷時刻）：辨識到卡片 → 鳥先以高 z-index(在面板之上)全寬低空
       快速掠入一次(dart)；掠入結束後降回舞台、z-index 回到面板之下、開始
       輕微上下浮動 idle，接著底部抽屜才升起（鳥先、面板後）。
       鎖定 latch：掃一次即停留，辨識丟失不消失；只由關閉面板(✕)淡出消失。
       圖與飛行風格資料驅動：content.js 的
       sprite / flight。尊重 prefers-reduced-motion（略過掠入，直接定位）。
       ============================================================ -->
  <div id="bird-layer" class="flight-dart" aria-hidden="true">
    <img id="bird-sprite" src="assets/kingfisher.png?v=2" alt="" loading="eager" decoding="async" />
  </div>

  <!-- ============================================================
       解說面板（DOM 疊層）——「下抽屜」bottom sheet，輔助角色。
       說明：A-Frame 內建的 <a-text> 使用 MSDF 字型，無法顯示中文，
       為了「文字清楚可讀」的中文需求，改用 HTML/CSS 疊層呈現。
       版面：固定在底部、佔下方約 60%（--drawer-h），圓角只在上緣，永遠
       不覆蓋上方鳥舞台區。結構分兩層：
         #p-header ── 不捲動的「標題列」＝把手 + 中文名，也是收合時的露出區(peek)
         #p-scroll ── 可捲動的其餘內容（學名/亞種/英文名/播放鈕/手風琴/授權）
       行為：掃到目標(targetFound)即（於鳥掠入後）升起並鎖定，之後目標離開也
       不消失；只有按右上角 ✕ 關閉鈕才淡出。把手可下滑收合成只露標題列、
       上滑展開。內容由 js/content.js 於執行時填入。
       ============================================================ -->
  <div id="panel" class="hidden">
    <!-- 字級切換鈕（無障礙）：兩段式「標準／大字」，放大面板內文字約 1.25 倍。
         選擇存入 localStorage，下次掃到自動沿用。 -->
    <button id="p-font" type="button" aria-pressed="false" aria-label="切換大字模式">大字</button>

    <!-- 關閉按鈕：按下才淡出面板、暫停音效並解除鎖定 -->
    <button id="p-close" aria-label="關閉">✕</button>

    <!-- 標題列（不捲動）＝收合時露出的 peek 區：把手 + 中文名 -->
    <div id="p-header">
      <!-- 抽屜把手：可點擊或上下滑動，收合／展開抽屜 -->
      <div id="p-handle" role="button" tabindex="0"
           aria-expanded="true" aria-label="收合或展開資訊面板"></div>
      <!-- 中文名（面板主畫面大字）。學名等其餘標題移到下方可捲動區。 -->
      <div id="p-name"></div>
    </div>

    <!-- 可捲動內容 -->
    <div id="p-scroll">
      <!-- 標題階層（其餘）：學名＋命名者同一行、亞種獨立一行、英文名。 -->
      <div id="p-sci-line">
        <span id="p-sci"></span><span id="p-sci-note"></span>
      </div>
      <div id="p-sub"></div>
      <div id="p-en"></div>

      <!-- 叫聲播放鈕：iOS 禁止未經手勢自動播放，故以「點擊播放」為主。
           掃到卡片會嘗試自動播，被擋下就靜默失敗、退回此鈕手動播。
           狀態（播放中／停止）由 audio 的 play/pause 事件同步。 -->
      <button id="p-audio" type="button" aria-pressed="false" aria-label="播放叫聲">
        <span id="p-audio-icon" aria-hidden="true">🔊</span><span id="p-audio-label">播放叫聲</span>
      </button>

      <!-- 六個手風琴項目：由 js/content.js 的 sections 動態產生。
           點按鈕在其下方展開該項 body；一次只展開一項，再點同一個收合。 -->
      <div id="p-accordion"></div>

      <!-- 錄音者／授權標示（授權合規）：小字次要色，內容來自 content.js 的
           callCredit；沒有就不顯示（見 CSS #p-credit:empty）。 -->
      <div id="p-credit"></div>
    </div>
  </div>

  <!-- ============================================================
       AR 場景。autoStart:false → 由 JS 在按下開始鈕後才 start。
       uiScanning / uiLoading 關掉 MindAR 內建 UI，改用我們自己的提示。
       ============================================================ -->
  <!-- 正式辨識目標：assets/target.mind（你自己的翠鳥卡） -->
  <a-scene
    id="ar-scene"
    mindar-image="imageTargetSrc: assets/target.mind; autoStart: false; uiScanning: no; uiLoading: no; uiError: no;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <!-- MindAR 相機 -->
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- 辨識目標 entity（僅用來接收 targetFound / targetLost 事件；
         視覺呈現全部改由 HTML 疊層面板負責，AR 場景不再放 3D 物件）。
         每加一種新鳥，在這裡新增一行
           <a-entity class="ar-target" mindar-image-target="targetIndex: N"></a-entity>
         N 必須等於 content.js 的 targetOrder 陣列中該鳥的位置（從 0 起算），
         且順序需與 MindAR 編譯器裡上傳圖片的順序一致。 -->
    <a-entity class="ar-target" mindar-image-target="targetIndex: 0"></a-entity>  <!-- 0: 八哥 myna -->
    <a-entity class="ar-target" mindar-image-target="targetIndex: 1"></a-entity>  <!-- 1: 日本松雀鷹 sparrowhawk -->
    <a-entity class="ar-target" mindar-image-target="targetIndex: 2"></a-entity>  <!-- 2: 家八哥 commonmyna -->
    <a-entity class="ar-target" mindar-image-target="targetIndex: 3"></a-entity>  <!-- 3: 翠鳥 kingfisher（原本是 targetIndex:0，這次務必改成 3） -->
    <a-entity class="ar-target" mindar-image-target="targetIndex: 4"></a-entity>  <!-- 4: 鳳頭蒼鷹 goshawk -->
    <a-entity class="ar-target" mindar-image-target="targetIndex: 5"></a-entity>  <!-- 5: 磯鷸 sandpiper -->
  </a-scene>

  <!-- ============================================================
       翠鳥叫聲。不再於掃到卡片時自動播放，改為僅由面板上的 🔊 播放鈕手動觸發；
       鎖定期間 targetLost 不暫停，按 ✕ 關閉鈕時才 pause()。
       loop 循環播放；音量在 js 內依 content.js 設定。
       （← 替換這裡：assets/call.mp3）
       ============================================================ -->
  <audio id="call" src="assets/call.mp3?v=4" loop preload="auto"></audio>

  <!-- ============================================================
       應用邏輯：開始鈕啟動 MindAR、targetFound/targetLost 事件、
       把 content.js 的內容填入面板、控制音效播放。
       ============================================================ -->
  <script>
    (function () {
      var startScreen = document.getElementById('start-screen');
      var startButton = document.getElementById('start-button');
      var scanHint    = document.getElementById('scan-hint');
      var sceneEl     = document.getElementById('ar-scene');
      var audioEl     = document.getElementById('call');
      var panelEl     = document.getElementById('panel');
      var accWrap     = document.getElementById('p-accordion');
      var fontButton  = document.getElementById('p-font');
      var audioButton = document.getElementById('p-audio');
      var audioIcon   = document.getElementById('p-audio-icon');
      var audioLabel  = document.getElementById('p-audio-label');
      var birdLayer   = document.getElementById('bird-layer');
      var birdSprite  = document.getElementById('bird-sprite');
      var panelHandle = document.getElementById('p-handle');
      var pHeader     = document.getElementById('p-header');

      // 是否偏好「減少動態」（無障礙）：用於略過掠入、改為直接定位＋淡入
      function prefersReducedMotion() {
        return !!(window.matchMedia &&
          window.matchMedia('(prefers-reduced-motion: reduce)').matches);
      }

      // 目前辨識到的鳥種 key：由 targetFound 依 entity 的 index 查 targetOrder 設定，
      // closePanel 時重置為 null。多目標時決定「面板要顯示哪一種鳥」。
      var currentBirdKey = null;

      // 取得目前展示的鳥種資料。優先用 currentBirdKey（多目標：掃到哪張卡就是哪隻）；
      // 沒有才 fallback 回 content.js 的 activeBird（保留舊行為相容）。
      function getBird() {
        var c = window.KINGFISHER_CONTENT || {};
        var birds = c.birds || {};
        var key = currentBirdKey || c.activeBird;
        return birds[key] || {};
      }

      // ---- 把鳥種主畫面欄位填入面板，並建立六個手風琴項目 ----
      function applyContent() {
        var bird = getBird();
        function set(id, val) {
          var el = document.getElementById(id);
          if (el) el.textContent = (val != null ? val : '');
        }

        // 跨物種配色：把這隻鳥的 accent 設到面板根元素，面板內所有
        // var(--accent)／--accent-soft 都會隨之改色。未設定則 fallback 預設色。
        // ★ 規範：accent 一律用沉穩、去飽和的博物館級色，禁止高飽和螢光色（見 content.js）。
        panelEl.style.setProperty('--accent', bird.accent || '#14707D');

        // 標題階層：中文名、學名＋命名者（括號）、亞種（獨立行）、英文名
        set('p-name', bird.name);
        set('p-sci', bird.sciName);
        // 命名者括號（如 (Linnaeus, 1758)）：接在學名後、次要色；
        // 相容舊資料：沒有 sciAuthor 時退回舊的 sciNote 欄位。
        var author = bird.sciAuthor || bird.sciNote || '';
        set('p-sci-note', author ? (' ' + author) : '');
        set('p-sub', bird.subspecies);   // 亞種自成一行
        set('p-en', bird.enName);

        // 叫聲音檔（資料驅動）：沒填就退回預設 call.mp3。
        // 只有在路徑真的不同時才改 src，避免不必要地重載音訊。
        var wantSrc = bird.callSrc || 'assets/call.mp3';
        if (audioEl.getAttribute('src') !== wantSrc) {
          audioEl.setAttribute('src', wantSrc);
          audioEl.load();
        }
        // 錄音者／授權標示：小字顯示於面板底部，沒有就留空（CSS 會隱藏）
        set('p-credit', bird.callCredit);

        // 2D 鳥圖（資料驅動）：sprite 圖路徑 + flight 飛行風格。
        // 只在路徑真的不同時才改 src；改後先 decode() 預載，避免首次顯示閃爍，
        // 缺圖/載入失敗則 birdReady=false，dartBird/showBirdImmediate 會略過（不顯示破圖）。
        var wantSprite = bird.sprite || 'assets/kingfisher.png';
        var spriteReady = Promise.resolve();   // 預設：路徑沒變，視為已就緒
        if (birdSprite.getAttribute('src') !== wantSprite) {
          birdReady = false;
          birdSprite.setAttribute('src', wantSprite);
          if (birdSprite.decode) {
            spriteReady = birdSprite.decode()
              .then(function () { birdReady = true; })
              .catch(function () { birdReady = false; });
          }
        }
        // 飛行風格 class（目前支援 dart；預設 dart）。先清掉舊的 flight-* 再套新的。
        Array.prototype.slice.call(birdLayer.classList).forEach(function (c) {
          if (c.indexOf('flight-') === 0) birdLayer.classList.remove(c);
        });
        birdLayer.classList.add('flight-' + (bird.flight || 'dart'));

        buildAccordion(bird.sections || []);

        return spriteReady;
      }

      // ---- 手風琴 ----
      // 依 sections 動態產生「按鈕 + 可展開內文」；一次只展開一項。
      var accItems = [];      // [{ item, btn, body }]
      var openIndex = -1;     // 目前展開的索引，-1 為全部收合

      function buildAccordion(sections) {
        accWrap.innerHTML = '';
        accItems = [];
        openIndex = -1;

        sections.forEach(function (sec, idx) {
          var item = document.createElement('div');
          item.className = 'acc-item';

          var btn = document.createElement('button');
          btn.className = 'acc-btn';
          btn.type = 'button';
          btn.textContent = sec.title || '';
          btn.setAttribute('aria-expanded', 'false');
          btn.addEventListener('click', function () { toggleItem(idx); });

          var body = document.createElement('div');
          body.className = 'acc-body';
          var inner = document.createElement('div');
          inner.className = 'acc-body-inner';
          inner.textContent = sec.body || '';
          body.appendChild(inner);

          item.appendChild(btn);
          item.appendChild(body);
          accWrap.appendChild(item);
          accItems.push({ item: item, btn: btn, body: body });
        });
      }

      function openItem(i) {
        var it = accItems[i];
        it.item.classList.add('open');
        it.btn.setAttribute('aria-expanded', 'true');
        // 設為實際內容高度 → max-height transition 平順展開
        it.body.style.maxHeight = it.body.scrollHeight + 'px';
      }
      function closeItem(i) {
        var it = accItems[i];
        it.item.classList.remove('open');
        it.btn.setAttribute('aria-expanded', 'false');
        it.body.style.maxHeight = '';   // 回到 CSS 的 0 → 平順收合
      }
      function toggleItem(idx) {
        if (openIndex === idx) {        // 再點同一個 → 收合
          closeItem(idx);
          openIndex = -1;
          return;
        }
        if (openIndex !== -1) closeItem(openIndex);  // 自動收起前一個
        openItem(idx);
        openIndex = idx;
      }

      // 音量（0~1），可在 content.js 以 volume 覆寫
      function applyAudioVolume() {
        var c = window.KINGFISHER_CONTENT || {};
        audioEl.volume = (typeof c.volume === 'number') ? c.volume : 0.6;
      }

      // ---- 叫聲播放控制（iOS 相容）----
      // UI 狀態一律由 audio 的 play/pause 事件驅動，確保「按鈕顯示的狀態」
      // 與「音訊實際狀態」永遠一致：自動播成功→顯示暫停；被瀏覽器擋下（無
      // play 事件）→ 維持「播放」讓使用者手動點。
      function setAudioUI(playing) {
        audioButton.setAttribute('aria-pressed', playing ? 'true' : 'false');
        audioIcon.textContent  = playing ? '⏸' : '🔊';
        audioLabel.textContent = playing ? '暫停叫聲' : '播放叫聲';
      }
      audioEl.addEventListener('play',  function () { setAudioUI(true); });
      audioEl.addEventListener('pause', function () { setAudioUI(false); });

      // 從頭播放；被 iOS 擋下時靜默失敗（不 throw，UI 維持「播放」）
      function playCall() {
        audioEl.currentTime = 0;
        audioEl.play().catch(function () { /* 未經手勢被擋：靜默，退回按鈕手動播 */ });
      }
      // 立即停止並重置（面板關閉／targetLost 用），避免重疊或背景續播
      function stopCall() {
        audioEl.pause();
        audioEl.currentTime = 0;   // pause 事件會把 UI 切回「播放」狀態
      }

      // ---- 2D 鳥圖「活起來」控制 ----
      // birdReady：圖片是否已載入可畫。缺圖/失敗則不顯示，避免破圖。
      // （decode() 於 applyContent 設定；下面 load/error 事件為不支援 decode 的
      //  瀏覽器補上同樣的狀態，並在載入失敗時確保鳥維持隱藏。）
      var birdReady = false;
      birdSprite.addEventListener('load',  function () { birdReady = true; });
      birdSprite.addEventListener('error', function () { birdReady = false; hideBird(); });

      // 直接定位顯示（無掠入）：減少動態偏好、或不需要驚艷時序時使用。
      function showBirdImmediate() {
        if (!birdReady) return;
        birdLayer.classList.remove('enter');   // 不拉高 z-index、不播 dart
        birdLayer.classList.add('show');
      }

      // 掠入：以高 z-index（.enter → z-index 25，在面板之上）全寬低空快速掠入一次，
      // 動畫結束後移除 .enter（z-index 降回 15，回到面板之下；位置仍在舞台中央，
      // 因 dart 結束於 translate 0,0＝無位移，故不會跳動），再呼叫 onDone。
      // 每次都先移除再加 class + 強制 reflow，確保重播。
      function dartBird(onDone) {
        if (!birdReady) { if (onDone) onDone(); return; }  // 沒鳥圖：不等，直接繼續
        birdLayer.classList.remove('enter');
        void birdLayer.offsetWidth;            // 強制 reflow，讓進場動畫重播
        birdLayer.classList.add('show', 'enter');

        var done = false;
        function after() {
          if (done) return;
          done = true;
          birdLayer.classList.remove('enter'); // 掠入結束：z-index 降回面板之下
          if (onDone) onDone();
        }
        // 以 animationend 為準；備援 timer 以防動畫未觸發事件（>0.7s dart）
        birdLayer.addEventListener('animationend', after, { once: true });
        setTimeout(after, 850);
      }

      // 隱藏：淡出（opacity transition）。只在按 ✕ 關閉面板(closePanel)時呼叫；
      // 鎖定 latch 期間 targetLost 不呼叫此函式——鳥掃一次就停留在畫面。
      function hideBird() {
        birdLayer.classList.remove('show', 'enter');
      }

      // ---- 啟動 MindAR（必須在使用者手勢中呼叫）----
      async function start() {
        applyContent();
        applyAudioVolume();

        // 已停用 iOS 音訊預解鎖：叫聲僅由 🔊 鈕手動播（點擊即手勢），
        // 預解鎖會在啟動時發出可聽見的叫聲，故移除（2026-08）。
        // audioEl.play().then(function () {
        //   audioEl.pause();
        //   audioEl.currentTime = 0;
        // }).catch(function () {});

        // 1) 在使用者手勢中，先明確以後置鏡頭(environment)請求相機權限。
        //    這能確保 iOS 取得後置鏡頭並在手勢內完成授權；拿到後立即釋放，
        //    交由 MindAR 開啟自己的相機（MindAR 內部同樣以 facingMode:"environment"，兩者對齊）。
        //    iOS 同時只允許一路相機，故務必先 stop() 再啟動 MindAR。
        try {
          var primeStream = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: { facingMode: { ideal: 'environment' } }
          });
          primeStream.getTracks().forEach(function (t) { t.stop(); });
        } catch (err) {
          return; // 拿不到相機就不啟動 MindAR
        }

        // 2) 啟動 MindAR
        var mindarSystem = sceneEl.systems['mindar-image-system'];
        if (mindarSystem) {
          try {
            await mindarSystem.start();
          } catch (err) {
            return;
          }
        } else {
          return;
        }

        // 相機/辨識就緒後切換 UI。
        startScreen.classList.add('hidden');
        scanHint.classList.remove('hidden');
      }

      // ---- 面板鎖定狀態 ----
      // locked=true：掃到目標後已顯示並鎖定，即使 targetLost 也不隱藏，
      // 只有按下關閉鈕才會淡出並解鎖。
      var locked = false;

      // ---- 抽屜收合狀態 ----
      // collapsed=true：抽屜下滑，只露出頂端標題列(peek)，露出更多上方鳥舞台。
      var collapsed = false;
      function setCollapsed(c) {
        collapsed = c;
        panelEl.classList.toggle('collapsed', c);
        panelHandle.setAttribute('aria-expanded', c ? 'false' : 'true');
        document.documentElement.classList.toggle('observe', c);  // 收合=觀察模式：放大鳥圖
      }
      // 量測實際標題列高度 → 設定收合時露出的 peek 高度（隨大字模式/內容變動）
      function updatePeek() {
        var h = pHeader.offsetHeight;
        if (h > 0) panelEl.style.setProperty('--peek-h', (h + 6) + 'px');
      }

      // 升起抽屜（上舞台鳥掠入結束後才呼叫）：預設展開、量測 peek。
      // 註：叫聲不再於掃到卡片時自動播放，改為僅由 🔊 播放鈕手動觸發。
      function showPanel() {
        scanHint.classList.add('hidden');
        panelEl.classList.remove('hidden');
        setCollapsed(false);                // 每次開啟都以展開狀態呈現
        // 先讓瀏覽器完成 layout 再量 peek（大字/內容已套用）
        updatePeek();
        panelEl.classList.add('show');      // 面板升起（CSS transform transition）
        // playCall();  // 已停用「掃卡自動播」：改為僅由 🔊 播放鈕手動觸發（2026-08）
      }

      // 關閉（使用者按 ✕ 時）：滑下、停止並重置音效、解除鎖定
      function closePanel() {
        locked = false;
        currentBirdKey = null;              // 解除鎖定：清掉目前鳥種，可再掃下一張卡
        panelEl.classList.remove('show');   // 面板滑下淡出
        stopCall();                         // 立即停止並重置叫聲
        hideBird();                         // 鳥一併淡出，回到乾淨的可再掃描狀態
        scanHint.classList.remove('hidden'); // 提示可再次掃描
      }

      // ---- 抽屜把手：點擊切換、上下滑動收合/展開 ----
      // 用 pointer 事件同時支援觸控與滑鼠；小位移視為點擊 → 切換收合狀態。
      var dragStartY = null, dragMoved = false;
      panelHandle.addEventListener('pointerdown', function (e) {
        dragStartY = e.clientY;
        dragMoved = false;
        if (panelHandle.setPointerCapture) {
          try { panelHandle.setPointerCapture(e.pointerId); } catch (err) {}
        }
      });
      panelHandle.addEventListener('pointermove', function (e) {
        if (dragStartY == null) return;
        if (Math.abs(e.clientY - dragStartY) > 8) dragMoved = true;
      });
      panelHandle.addEventListener('pointerup', function (e) {
        if (dragStartY == null) return;
        var dy = e.clientY - dragStartY;
        dragStartY = null;
        if (!dragMoved || Math.abs(dy) < 24) { setCollapsed(!collapsed); return; }
        setCollapsed(dy > 0);               // 下滑收合、上滑展開
      });
      panelHandle.addEventListener('pointercancel', function () { dragStartY = null; });
      panelHandle.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
          e.preventDefault();
          setCollapsed(!collapsed);
        }
      });
      // 視窗尺寸變動（旋轉/工具列收合）時重量 peek
      window.addEventListener('resize', function () {
        if (panelEl.classList.contains('show')) updatePeek();
      });

      // ---- 綁定 MindAR 目標事件 ----
      // 多目標：抓「所有」.ar-target entity，用 index 逐一綁定。
      // 每個 entity 的 index 對應 content.js 的 targetOrder[index]（該卡片的鳥種 key）。
      function bindTargetEvents() {
        var targets = document.querySelectorAll('.ar-target');

        Array.prototype.forEach.call(targets, function (targetEl, index) {
          targetEl.addEventListener('targetFound', function () {
            // 鎖定 latch：第一次掃到就進入鎖定；此後再次 targetFound 一律忽略，
            // 不重播入場掠入動畫（避免一直重播）。
            //
            // ★ 多物種規則落點 ★：鎖定期間「先忽略其他卡片」，必須先按 ✕ 關閉
            //   （closePanel 會把 locked 重置）才能掃下一種。日後若要改成
            //   「關閉即可掃下一隻」，重點就在這道 locked 閘門與 closePanel 的
            //   重置——例如關閉後允許新的 targetFound 帶入新的鳥種內容。
            if (locked) return;

            locked = true;        // 掃一次即鎖定：之後 targetLost 不再隱藏鳥與面板

            // 用此 entity 的 index 查 targetOrder，決定要展示哪一種鳥。
            var c = window.KINGFISHER_CONTENT || {};
            var order = c.targetOrder || [];
            currentBirdKey = order[index] || null;

            // 依 currentBirdKey 重新填入面板內容（含鳥圖、學名、手風琴…）
            // applyContent() 現在回傳一個 Promise：sprite 圖片真正 decode 完成才 resolve，
            // 避免 decode() 非同步跑完前就搶先判斷 birdReady 導致第一次跳過動畫。
            applyContent().then(function () {
              // 驚艷時序：鳥先掠入 → 掠入結束後底部抽屜才升起（鳥先、面板後）。
              if (prefersReducedMotion()) {
                showBirdImmediate();  // 減少動態：不掠入，直接定位
                showPanel();          // 面板改淡入（見 CSS reduced-motion）
              } else {
                dartBird(function () { showPanel(); });  // 掠入完成才升面板
              }
            });
          });

          targetEl.addEventListener('targetLost', function () {
            // 鎖定 latch：掃一次即停留在畫面。鎖定期間目標離開畫面「不」做任何
            // 收起動作——鳥、面板、叫聲全部維持，讓使用者能離開圖卡繼續看與聽。
            // 一切只由右上角 ✕ 關閉鈕（closePanel）收起並解除鎖定。
            // （守衛：理論上 targetFound 會立即 locked=true，故未鎖定就丟失幾乎
            //   不會發生；仍保留原本的清理，作為未鎖定狀態的安全網。）
            if (locked) return;
            stopCall();
            hideBird();
          });
        });
      }

      // ---- 大字模式（無障礙）----
      // 以 CSS 變數 --panel-font-scale 控制面板內文字大小（大字約 1.25 倍）。
      // 選擇存入 localStorage，下次進頁自動沿用。
      var FONT_KEY = 'kf-large-font';
      var largeFont = false;
      try { largeFont = localStorage.getItem(FONT_KEY) === '1'; } catch (e) {}

      function applyFontScale(large) {
        document.documentElement.style.setProperty('--panel-font-scale', large ? '1.25' : '1');
        fontButton.setAttribute('aria-pressed', large ? 'true' : 'false');
        // 兩段式：目前是大字就顯示「標準」，反之顯示「大字」
        fontButton.textContent = large ? '標準' : '大字';
        // 若手風琴正展開，字級改變後重算高度，避免內容被裁切
        if (openIndex !== -1 && accItems[openIndex]) {
          accItems[openIndex].body.style.maxHeight =
            accItems[openIndex].body.scrollHeight + 'px';
        }
        // 標題（中文名）字級變動 → 標題列高度變動，重量收合露出的 peek 高度
        if (panelEl.classList.contains('show')) updatePeek();
      }

      fontButton.addEventListener('click', function () {
        largeFont = !largeFont;
        try { localStorage.setItem(FONT_KEY, largeFont ? '1' : '0'); } catch (e) {}
        applyFontScale(largeFont);
      });

      // 頁面載入即套用先前選擇（面板尚未展開，僅設定變數與按鈕狀態）
      applyFontScale(largeFont);

      // 叫聲播放鈕：點擊切換播放／停止（此點擊本身就是 iOS 允許的使用者手勢）
      audioButton.addEventListener('click', function () {
        if (audioEl.paused) playCall();
        else stopCall();
      });

      startButton.addEventListener('click', start);
      document.getElementById('p-close').addEventListener('click', closePanel);

      // 量測實際可視高度（跨瀏覽器穩定，供觀察模式置中）
      function setAppH() {
        document.documentElement.style.setProperty('--app-h', window.innerHeight + 'px');
      }
      setAppH();
      window.addEventListener('resize', setAppH);
      window.addEventListener('orientationchange', setAppH);

      if (sceneEl.hasLoaded) bindTargetEvents();
      else sceneEl.addEventListener('loaded', bindTargetEvents);
    })();
  </script>
</body>
</html>
